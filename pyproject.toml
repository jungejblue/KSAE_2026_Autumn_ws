[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksae-2026-autumn"
version = "0.4.0"
description = "Tools for running TransFuser++ in CARLA and scoring driving-control results"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["ruff==0.16.6"]
fallback = ["numpy==1.26.4"]
ipopt = ["numpy==1.26.4", "casadi>=3.6,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
