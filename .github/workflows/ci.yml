name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check code
        run: python -m ruff check .
      - name: Check shell syntax
        run: bash -n tools/docker.sh
      - name: Run pair example
        run: python tools/evaluate_pairs.py configs/pairs.example.json
